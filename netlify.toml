[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/home.html"
  to = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/about.html"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/cars.html"
