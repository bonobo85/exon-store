<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exon Store - Redirection</title>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var lang = params.get('lang');
            var target = 'category/index.html';
            if (lang === 'en' || lang === 'fr') {
                target += '?lang=' + lang;
            }
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirection vers <a href="category/index.html">Exon Store</a>...</p>
</body>
</html>
