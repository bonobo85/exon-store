[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/category/index.html"
  status = 301

[[redirects]]
  from = "/home.html"
  to = "/category/index.html"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/category/about.html"
  status = 301

[[redirects]]
  from = "/cars.html"
  to = "/category/cars.html"
  status = 301

[[redirects]]
  from = "/clothes.html"
  to = "/category/clothes.html"
  status = 301

[[redirects]]
  from = "/scripts.html"
  to = "/category/scripts.html"
  status = 301

[[redirects]]
  from = "/templates.html"
  to = "/category/templates.html"
  status = 301

[[redirects]]
  from = "/admin.html"
  to = "/category/admin.html"
  status = 301